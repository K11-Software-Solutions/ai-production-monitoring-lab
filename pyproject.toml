[project]
name = "ai-production-monitoring-lab"
version = "1.0.0"
description = "Monitor an AI assistant in production: tracing, online evals, drift, guardrails, feedback loops, shadow releases, and tests for the monitoring itself."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
