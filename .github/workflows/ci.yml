name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Unit tests (system, guardrails, evaluators, monitors, triage, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  monitoring-evals:
    name: Test the monitoring (incident detection, false alarms, guardrails, releases)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Simulate production and evaluate the monitors
        run: python -m evals.run_monitoring_evals
      - name: Publish report to the job summary
        if: always()
        run: cat evals/results/monitoring_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Negative controls (broken monitors MUST fail)
        run: |
          for variant in mean-latency no-stats; do
            if python -m evals.run_monitoring_evals --monitor $variant --out /tmp/neg-$variant > /dev/null; then
              echo "::error::The '$variant' monitor passed the gate. The gate is broken."
              exit 1
            fi
            echo "Gate correctly rejected the '$variant' monitor."
          done
      - name: Keep the simulated traces for inspection
        run: |
          python -m prodlab.simulate --scenario incidents --out data/incidents.jsonl
          python -m prodlab.simulate --scenario quiet --out data/quiet.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report-and-traces
          path: |
            evals/results/
            data/
